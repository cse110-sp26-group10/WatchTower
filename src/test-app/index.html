<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drape — Clothing Store</title>
    <link rel="stylesheet" href="assets/styles/styles.css" />
    <script
      src="../app/tracker/watchtower.js"
      data-apikey="00000000-0000-4000-8000-000000000001"
    ></script>
    <script>
      if (
        window.location.hostname === "localhost" ||
        window.location.hostname === "127.0.0.1"
      ) {
        window.__WATCHTOWER_CONFIG__.apiKey =
          "00000000-0000-4000-8000-000000000000";
      }
    </script>
  </head>
  <body>
    <nav class="nav">
      <a class="nav-brand" href="index.html">Drape</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
      </ul>
      <a class="nav-cart" href="cart.html"
        >Cart (<span id="cart-count">0</span>)</a
      >
    </nav>
    <section class="hero">
      <h1>Wear it your way.</h1>
      <p>Clean essentials for everyday life.</p>
      <a class="btn btn-primary" href="shop.html">Shop Now</a>
    </section>
    <section class="section">
      <h2 class="section-title">Featured</h2>
      <div class="product-grid" id="featured-grid"></div>
    </section>
    <div class="error-zone">
      <p>WatchTower test tools — trigger errors for dashboard testing</p>
      <button type="button" class="btn btn-danger" onclick="triggerTypeError()">
        Trigger TypeError
      </button>
      <button type="button" class="btn btn-danger" onclick="triggerWarning()">
        Trigger Warning
      </button>
    </div>
    <footer class="footer">
      Drape Test Store — WatchTower integration test
    </footer>
    <script src="assets/scripts/products.js"></script>
    <script src="assets/scripts/cart.js"></script>
    <script src="assets/scripts/home.js"></script>
  </body>
</html>
